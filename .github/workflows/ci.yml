name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.11.7'
      - run: ./scripts/test.sh
      - run: uvx --from shellcheck-py shellcheck install.sh bootstrap.sh start.sh scripts/test.sh scripts/publish_release.sh
      - run: .venv/bin/python scripts/build_installer.py
      - run: bash dist/rh-prem-bot-installer.run --help
